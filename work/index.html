            height: 1px;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }
        .scroll-track-horizontal::after {
            content: '';
            position: absolute;
            left: -100%;
            top: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            animation: trackScrollHorizontal 2.2s ease-in-out infinite;
        }
        @keyframes trackScrollHorizontal {
            0%   { left: -100%; opacity: 1; }
            80%  { left: 100%; opacity: 1; }
            100% { left: 100%; opacity: 0; }

            display: grid;

            grid-template-rows: 1fr 1fr;

            padding: 60px 40px 80px 23px;

        .card {

        .card:hover {

        .card img,

            display: block;
            width: 100%;
            flex: 1;
            min-height: 0;

            border-radius: 12px;
            transition: transform 400ms ease;

        .card:hover img {

<body>
    <div class="top-nav-container">
        <div class="nav-button redes-button" id="redesButton" role="button" tabindex="0" aria-label="Go to Home">Hello</div>
        <div class="nav-button work-button" id="workButton" role="button" tabindex="0" aria-label="Go to Work">Work</div>
        <div class="nav-button light-button" id="lightButton" role="button" tabindex="0" aria-label="Toggle theme">Light</div>
        <div class="nav-button hola-button" id="holaButton">
            <span class="hola-text">Let's talk!</span>
            <span class="hola-socials">
                <button class="social-btn" data-url="https://www.instagram.com/pa___bz/">IG</button>
                <button class="social-btn" data-url="https://www.linkedin.com/in/pablo-iba%C3%B1ez-5773891a6/" style="text-transform:lowercase;">in</button>
                <button class="social-btn" data-url="https://wa.link/ovb1bg">WSP</button>
            </span>
        </div>
    </div>

    <div class="nav-button bottom-right-container" id="limaTimeContainer" style="cursor:pointer;">
        <span id="tzLabel">Peru, Lima</span> <span id="limaTime">--:--</span>
    </div>

    <button class="ver-todo-button" id="verTodoBtn" aria-label="Ver todos los proyectos"><span class="desktop-text">Ver todo</span><span class="mobile-text">See all</span></button>

    <div class="nav-button bottom-middle-scroll">
        <span>Scroll</span>
        <div class="scroll-track-horizontal"></div>
    </div>

    <div class="filter-buttons" id="filterButtons">
        <button class="filter-btn active" data-filter="client">Client</button>
        <button class="filter-btn" data-filter="freestyle">Freestyle</button>
    </div>

    <div class="scroll-wrap" id="scrollWrap">
        <div class="track" id="track"></div>
    </div>

    <script>
    // Theme
    const themeBtn = document.getElementById('lightButton');
    const saved = localStorage.getItem('theme');
    function isMobile() { return window.innerWidth <= 768; }
    function updateLightBtn(dark) {
        themeBtn.textContent = dark ? 'Dark' : 'Light';
    }
    if (saved === 'dark') {
        document.body.classList.add('dark-theme');
        updateLightBtn(true);
    } else {
        updateLightBtn(false);
    }
    themeBtn.addEventListener('click', () => {
        const dark = document.body.classList.toggle('dark-theme');
        updateLightBtn(dark);
        localStorage.setItem('theme', dark ? 'dark' : 'light');
    });
    window.addEventListener('resize', () => updateLightBtn(document.body.classList.contains('dark-theme')));

    // Hello → index
    document.getElementById('redesButton').addEventListener('click', () => {
        window.location.href = '../';
    });

    // Work → scroll to top (already on Work page)
    document.getElementById('workButton').addEventListener('click', () => {
        document.getElementById('scrollWrap').scrollTo({ left: 0, behavior: 'smooth' });
    });

    // Clock
    const timezones = [
        { zone: 'America/Lima', label: 'Peru, Lima' },
        { zone: 'Europe/Madrid', label: 'Madrid, España' }
    ];
    let currentTzIndex = 0;
    function updateClock() {
        const timeEl = document.getElementById('limaTime');
        const tzLabelEl = document.getElementById('tzLabel');
        if (!timeEl) return;
        const tz = timezones[currentTzIndex];
        const now = new Date();
        timeEl.textContent = new Intl.DateTimeFormat('en-US', {
            timeZone: tz.zone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        }).format(now);
        if (tzLabelEl) tzLabelEl.textContent = tz.label;
    }
    document.getElementById('limaTimeContainer').addEventListener('click', () => {
        currentTzIndex = (currentTzIndex + 1) % timezones.length;
        updateClock();
    });
    updateClock();
    setInterval(updateClock, 1000);

    // Mouse wheel → horizontal scroll
    const scrollWrap = document.getElementById('scrollWrap');
    scrollWrap.addEventListener('wheel', (e) => {
        e.preventDefault();
        scrollWrap.scrollLeft += e.deltaY;
    }, { passive: false });

    // Fixed order and slot mapping
    const SLOT = [
        { title: 'Al Este',                cls: 'card-wide' },
        { title: 'Equipera',               cls: 'card-half-top' },
        { title: 'UTEC',                   cls: 'card-half-bottom' },
        { title: 'Mali × Infinito',        cls: 'card-wide' },
        { title: 'Duardo',                 cls: 'card-stretch' },
        { title: 'WAYKA',                  cls: 'card-stretch' },
        { title: 'Arica',                  cls: 'card-stretch' },
        { title: 'Agora Shop',             cls: 'card-stretch' },
        { title: 'Casino Tokyo Bloom',     cls: 'card-wide' },
        { title: 'Diversa',                cls: 'card-wide' },
        // Freestyle
        { title: 'INF',                    cls: 'card-wide' },
        { title: 'PABZ',                   cls: 'card-half-top' },
        { title: 'PLEBZ',                  cls: 'card-half-bottom' },
        { title: 'PLOBZ ANGRY',            cls: 'card-wide' },
        { title: 'PLOBZ',                  cls: 'card-stretch' },
        { title: 'SHAPE',                  cls: 'card-stretch' },
        { title: 'THORN EXP',              cls: 'card-wide' },
        { title: 'THORN',                  cls: 'card-half-top' },
        { title: 'TYPE',                   cls: 'card-half-bottom' },
        { title: 'VALENCIA',               cls: 'card-wide' },
        { title: 'WAVE',                   cls: 'card-wide' },
    ];

    // All projects in fixed order
    const ALL_PROJECTS = [
        { title: 'Al Este', type: 'client', img: 'client/aleste.png', page: '../aleste/' },
        { title: 'Equipera', type: 'client', img: 'client/equipera.png' },
        { title: 'UTEC', type: 'client', img: 'client/utec.m4v', video: true },
        { title: 'Mali × Infinito', type: 'client', img: 'client/mali.jpg', page: '../mali/' },
        { title: 'Duardo', type: 'client', img: 'client/duardo.png' },
        { title: 'WAYKA', type: 'client', img: 'client/wayka.png' },
        { title: 'Casino Tokyo Bloom', type: 'client', img: 'client/casinotb.png', page: '../casinotb/' },
        { title: 'Diversa', type: 'client', img: 'client/diversa.png' },
        { title: 'Arica', type: 'client', img: 'client/arica.png', comingSoon: true },
        { title: 'Agora Shop', type: 'client', img: 'client/agora.png', comingSoon: true },
        // Freestyle
        { title: 'INF', type: 'freestyle', cloudinary: 'INF_xvkew0' },
        { title: 'PABZ', type: 'freestyle', cloudinary: 'PABZ_svxulg' },
        { title: 'PLEBZ', type: 'freestyle', img: 'FREESTYLE/PLEBZ.png' },
        { title: 'PLOBZ ANGRY', type: 'freestyle', img: 'freestyle/PLOBZ_ANGRY.jpg' },
        { title: 'PLOBZ', type: 'freestyle', cloudinary: 'PLOBZ_hwng1f' },
        { title: 'SHAPE', type: 'freestyle', img: 'FREESTYLE/SHAPE.jpg' },
        { title: 'THORN EXP', type: 'freestyle', cloudinary: 'THORN_EXP_wzinuf' },
        { title: 'THORN', type: 'freestyle', cloudinary: 'THORN_tgxwcr' },
        { title: 'TYPE', type: 'freestyle', cloudinary: 'TYPE_ggp1ea' },
        { title: 'VALENCIA', type: 'freestyle', cloudinary: 'VALENCIA_q8lbqg' },
        { title: 'WAVE', type: 'freestyle', img: 'FREESTYLE/WAVE.png' },
    ];

    const track = document.getElementById('track');
    let currentFilter = 'client';
    function renderProjects(filter) {
        filter = filter || 'client';
        track.innerHTML = '';
            ALL_PROJECTS.forEach(p => {
                if (p.type !== filter) return;
            const slot = SLOT.find(s => s.title === p.title);
            const card = document.createElement('div');
            card.className = 'card ' + (slot ? slot.cls : 'card-stretch');
            if (p.page) {
                card.style.cursor = 'pointer';
                card.addEventListener('click', () => {
                    const allCards = [...track.querySelectorAll('.card')];
                    allCards.forEach((c, i) => {
                        const delay = i * 50;
                        setTimeout(() => {
                            c.style.opacity = '0';
                            c.style.transform = 'scale(0.96)';
                        }, delay);
                    });
                    setTimeout(() => window.location.href = p.page, 100 + allCards.length * 50 + 300);
                });
            }
            if (p.cloudinary) {
                const vid = document.createElement('video');
                vid.src = 'https://res.cloudinary.com/yaj8nng4/video/upload/v1/' + p.cloudinary + '.mp4';
                vid.muted = true;
                vid.loop = true;
                vid.playsInline = true;
                vid.autoplay = true;
                vid.className = 'card-video';
                card.appendChild(vid);
            } else if (p.video) {
                const vid = document.createElement('video');
                vid.src = p.img;
                vid.muted = true;
                vid.loop = true;
                vid.playsInline = true;
                vid.autoplay = true;
                vid.className = 'card-video';
                card.appendChild(vid);
            } else {
                const img = document.createElement('img');
                img.src = p.img;
                img.alt = p.title;
                img.loading = 'lazy';
                card.appendChild(img);
            }
            if (p.type !== 'freestyle') {
                const overlay = document.createElement('div');
                overlay.className = 'card-overlay';
                overlay.innerHTML = `<span class="card-title">${p.title}</span>`;
                card.appendChild(overlay);
            }
            if (p.comingSoon) {
                const phrases = ['Coming soon', 'Still Rendering...', 'Stay Tuned.', 'Cooking...', 'Soon-ish.', 'Making It Look Expensive...'];
                const sphere = document.createElement('div');
                sphere.className = 'coming-soon-sphere';
                const txt = document.createElement('span');
                txt.textContent = phrases[Math.floor(Math.random() * phrases.length)];
                sphere.appendChild(txt);
                card.appendChild(sphere);
            }
            track.appendChild(card);
        });
    }

    renderProjects();

    window.addEventListener('pageshow', function() {
        const cards = track.querySelectorAll('.card');
        cards.forEach(c => {
            c.style.opacity = '';
            c.style.transform = '';
            c.style.transition = '';
        });
    });

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            if (this.dataset.filter === currentFilter) return;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const newFilter = this.dataset.filter;
            const allCards = [...track.querySelectorAll('.card')];
            allCards.forEach((c, i) => {
                const delay = i * 50;
                setTimeout(() => {
                    c.style.opacity = '0';
                    c.style.transform = 'scale(0.96)';
                }, delay);
            });
            const animDelay = allCards.length * 50 + 100;
            setTimeout(() => {
                currentFilter = newFilter;
                renderProjects(currentFilter);
                const cards = track.querySelectorAll('.card');
                cards.forEach((c, i) => {
                    c.style.opacity = '0';
                    c.style.transform = 'scale(0.96)';
                    setTimeout(() => {
                        c.style.transition = 'opacity 0.3s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1)';
                        c.style.opacity = '1';
                        c.style.transform = 'scale(1)';
                    }, 80 + i * 60);
                });
            }, animDelay);
            document.getElementById('scrollWrap').scrollTo({ left: 0, behavior: 'smooth' });
        });
    });

    // Animate cards appearing when coming back from a project
    if (sessionStorage.getItem('fromProject')) {
        sessionStorage.removeItem('fromProject');
        const cards = track.querySelectorAll('.card');
        cards.forEach((c, i) => {
            c.style.opacity = '0';
            c.style.transform = 'scale(0.96)';
            setTimeout(() => {
                c.style.transition = 'opacity 0.3s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1)';
                c.style.opacity = '1';
                c.style.transform = 'scale(1)';
            }, 80 + i * 60);
        });
    }
    </script>
    <script>
    // Desktop Let's talk!
    const holaButton = document.getElementById('holaButton');
    let isHolaActive = false;
    function resetHolaButton() {
        if (isHolaActive) {
            if (window.innerWidth <= 768) {
                holaButton.classList.remove('active-socials');
                isHolaActive = false;
                return;
            }
            const btns = holaButton.querySelectorAll('.social-btn');
            btns.forEach(btn => {
                btn.style.opacity = '0';
                btn.style.transform = 'scale(0.96)';
            });
            setTimeout(() => {
                holaButton.classList.remove('active-socials');
                isHolaActive = false;
            }, 250);
        }
    }
    if (holaButton) {
        holaButton.addEventListener('click', function(e) {
            e.stopPropagation();
            if (isHolaActive) {
                resetHolaButton();
                return;
            }
            this.classList.add('active-socials');
            if (window.innerWidth > 768) {
                const btns = this.querySelectorAll('.social-btn');
                btns.forEach(btn => {
                    btn.style.opacity = '0';
                    btn.style.transform = 'scale(0.96)';
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        window.open(this.dataset.url, '_blank');
                        resetHolaButton();
                    });
                });
                requestAnimationFrame(() => {
                    btns.forEach(btn => {
                        btn.style.opacity = '';
                        btn.style.transform = '';
                    });
                });
            } else {
                const btns = this.querySelectorAll('.social-btn');
                btns.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        window.open(this.dataset.url, '_blank');
                        resetHolaButton();
                    });
                });
            }
            isHolaActive = true;
        });
        document.addEventListener('click', function(e) {
            if (isHolaActive && !holaButton.contains(e.target)) resetHolaButton();
        });
    }
    </script>
    <button class="mobile-lets-talk" id="mobileLetstalk" aria-label="Open social links">Let's talk!</button>
    <script>
        const mobileBtn = document.getElementById('mobileLetstalk');
        let mobileExpanded = false;
        mobileBtn.addEventListener('click', function() {
            if (mobileExpanded) {
                this.textContent = "Let's talk!";
                this.style.padding = '8px 3px 4px 12px';
                mobileExpanded = false;
            } else {
                this.innerHTML = '<span class="social-row"><button class="mobile-social-btn" data-url="https://www.instagram.com/pa___bz/">IG</button><button class="mobile-social-btn" style="text-transform:lowercase;" data-url="https://www.linkedin.com/in/pablo-iba%C3%B1ez-5773891a6/">in</button><button class="mobile-social-btn" data-url="https://wa.link/ovb1bg">WSP</button></span>';
                this.style.padding = '0';
                this.querySelectorAll('[data-url]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        window.open(this.dataset.url, '_blank');
                    });
                });
                mobileExpanded = true;
            }
        });
        document.addEventListener('click', function(e) {
            if (mobileExpanded && !mobileBtn.contains(e.target)) {
                mobileBtn.textContent = "Let's talk!";
                mobileBtn.style.padding = '8px 3px 4px 12px';
                mobileExpanded = false;
            }
        });
    </script>
